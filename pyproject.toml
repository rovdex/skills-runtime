[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-memory-runtime"
version = "0.1.0"
description = "Derived SQLite projection and deterministic Recall runtime for Shared Memory Experience overlays"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
